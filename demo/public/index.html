<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AfriRate on Alexa+ (simulator)</title>
<style>
  :root {
    --room: #0e1116;
    --bezel: #1b1f26;
    --screen: #05070b;
    --ink: #f3f5f8;
    --muted: #8b95a5;
    --faint: #2a313c;
    --card: #10151d;
    --card-edge: #1e2733;
    --accent: #2ec5f0;
    --accent-2: #3a7bff;
    --warn: #ffb347;
    --bad: #ff6b6b;
    --good: #4fd18b;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% 20%, #18202b 0%, var(--room) 70%);
    color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 24px 16px;
  }

  /* ---- the device ---- */
  .device {
    width: min(1040px, 100%);
    background: var(--bezel);
    border-radius: 28px;
    padding: 18px 18px 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .screen {
    position: relative; overflow: hidden;
    aspect-ratio: 16 / 9;
    background: var(--screen);
    border-radius: 14px;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: 22px 30px 26px;
  }
  .topbar { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 15px; }
  .skill { display: flex; align-items: center; gap: 8px; letter-spacing: .02em; }
  .skill b { color: var(--ink); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  .stage { display: grid; grid-template-rows: auto 1fr; gap: 12px; min-height: 0; padding-top: 10px; }
  .heard { color: var(--muted); font-size: 20px; min-height: 28px; font-style: italic; }
  .cards { display: flex; gap: 16px; align-items: flex-start; min-height: 0; overflow: hidden; }
  .reply { font-size: 25px; line-height: 1.35; font-weight: 500; min-height: 68px; max-width: 92%; }

  .idle { display: grid; place-content: center; text-align: center; height: 100%; gap: 6px; }
  .idle .clock { font-size: 96px; font-weight: 200; letter-spacing: -.02em; }
  .idle .hint { color: var(--muted); font-size: 20px; }

  .lightbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent), var(--accent-2));
    background-size: 200% 100%;
    opacity: 0; transition: opacity .25s;
  }
  .listening .lightbar { opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
  .thinking  .lightbar { opacity: 1; animation: sweep 1.2s linear infinite; }
  .speaking  .lightbar { opacity: 1; animation: sweep 2.4s linear infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes sweep { to { background-position: -200% 0; } }

  /* ---- cards ---- */
  .card {
    flex: 1 1 0; min-width: 0;
    background: var(--card); border: 1px solid var(--card-edge); border-radius: var(--radius);
    padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
    animation: rise .35s ease-out both;
  }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } }
  .card .tool { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
  .card .tool code { text-transform: none; letter-spacing: 0; color: var(--accent); font-size: 13px; }
  .card .hero { font-size: 40px; font-weight: 600; line-height: 1.1; }
  .card .sub { color: var(--muted); font-size: 16px; }
  .card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 16px; }
  .card li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--faint); padding-bottom: 5px; }
  .card li span:last-child { color: var(--muted); white-space: nowrap; }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; }
  .badge.age { background: rgba(255,179,71,.14); color: var(--warn); }
  .badge.stale { background: rgba(255,107,107,.15); color: var(--bad); }
  .badge.ok { background: rgba(79,209,139,.14); color: var(--good); }
  .note { font-size: 14px; color: var(--warn); }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: 70px 1fr 90px; align-items: center; gap: 10px; font-size: 15px; }
  .bar i { display: block; height: 10px; border-radius: 6px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
  .bell { font-size: 34px; }
  .alert { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--faint); font-size: 16px; }
  .alert b { font-weight: 600; }
  .alert.fired b { color: var(--accent); }
  .alert small { color: var(--muted); font-size: 14px; }
  .card.err { border-color: rgba(255,107,107,.35); }
  .card.err .tool span { color: var(--bad); }
  .raw { white-space: pre-wrap; font: 13px/1.4 ui-monospace, monospace; color: var(--muted); overflow: hidden; }

  /* ---- narrator overlay (video recording only) ---- */
  .overlay {
    position: absolute; inset: 0; display: none; place-content: center; text-align: center; gap: 14px;
    background: radial-gradient(800px 500px at 50% 40%, #0d1a2a 0%, #05070b 75%); padding: 40px;
  }
  .overlay.on { display: grid; animation: rise .4s ease-out both; }
  .overlay h1 { margin: 0; font-size: 54px; font-weight: 700; letter-spacing: -.01em; }
  .overlay p { margin: 0 auto; font-size: 24px; color: #c6d0dd; max-width: 820px; }
  .overlay .small { font-size: 18px; color: var(--muted); }
  .overlay code { color: var(--accent); font-size: 22px; }
  .caption {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(5,7,11,.85); border: 1px solid var(--card-edge); border-radius: 12px;
    padding: 8px 16px; font-size: 17px; color: #c6d0dd; display: none; max-width: 86%; text-align: center;
  }
  .caption.on { display: block; }

  /* ---- controls under the device ---- */
  .controls { width: min(1040px, 100%); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .controls input {
    flex: 1 1 320px; min-width: 0; background: #121821; color: var(--ink); border: 1px solid var(--card-edge);
    border-radius: 12px; padding: 12px 14px; font-size: 16px;
  }
  button {
    background: #18212d; color: var(--ink); border: 1px solid var(--card-edge); border-radius: 12px;
    padding: 12px 16px; font-size: 15px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  #mic.rec { background: var(--accent); color: #031018; border-color: var(--accent); }
  .chip { color: var(--muted); font-size: 14px; }
  .chip code { color: var(--accent); }
  details { width: min(1040px, 100%); color: var(--muted); font-size: 14px; }
  details pre { white-space: pre-wrap; background: #0b0f15; border: 1px solid var(--card-edge); border-radius: 12px; padding: 12px; max-height: 320px; overflow: auto; }
  .recording .controls, .recording details { display: none; }
  .recording { padding: 0; gap: 0; }
  .recording .device { width: 1240px; padding: 10px 10px 14px; border-radius: 22px; }
</style>
</head>
<body>
  <div class="device">
    <div class="screen" id="screen">
      <div class="topbar">
        <div class="skill"><span class="dot"></span><b>AfriRate</b> · African exchange rates via MCP</div>
        <div id="clock"></div>
      </div>
      <div class="stage" id="stage">
        <div class="idle" id="idle">
          <div class="clock" id="bigclock"></div>
          <div class="hint">Try “What's 250 US dollars in Kenyan shillings?”</div>
        </div>
      </div>
      <div class="reply" id="reply"></div>
      <div class="lightbar"></div>
      <div class="overlay" id="overlay"></div>
      <div class="caption" id="caption"></div>
    </div>
  </div>

  <div class="controls">
    <button id="mic" title="Click to talk, click again to stop">🎙 Talk</button>
    <input id="text" placeholder="…or type what you'd say, then Enter" autocomplete="off">
    <button id="newday" title="Start a new conversation. The watchlist is kept, like a device remembering its owner.">☀ New day</button>
    <span class="chip" id="chip"></span>
  </div>
  <details>
    <summary>MCP calls in the last answer</summary>
    <pre id="log">None yet.</pre>
  </details>

<script>
const $ = (id) => document.getElementById(id);
const screen = $('screen');
const state = {
  previous: null,
  watchlist: null,
};
try { state.watchlist = localStorage.getItem('afrirate.watchlist'); } catch {}

/* ------------------------------------------------------------------ clock */
function tick() {
  const now = new Date();
  const t = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('clock').textContent = t;
  if ($('bigclock')) $('bigclock').textContent = t;
}
setInterval(tick, 1000); tick();

function setMode(mode) {
  screen.classList.remove('listening', 'thinking', 'speaking');
  if (mode) screen.classList.add(mode);
}
function showChip() {
  $('chip').innerHTML = state.watchlist ? `Watchlist saved on this device: <code>${state.watchlist}</code>` : '';
}
showChip();

/* ----------------------------------------------------------------- audio */
// Every clip the page plays is logged with its start time, so the video
// recorder can lay the same audio under the silent screen capture.
window.__audioLog = [];
let currentAudio = null;

async function play(text, voice) {
  const res = await fetch('/api/tts', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text, voice }),
  });
  if (!res.ok) throw new Error((await res.json()).error);
  const buf = await res.arrayBuffer();
  const url = URL.createObjectURL(new Blob([buf], { type: 'audio/mpeg' }));
  const audio = new Audio(url);
  currentAudio = audio;
  await new Promise((resolve) => {
    audio.onended = resolve; audio.onerror = resolve;
    audio.onplay = () => {
      let bin = '';
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      window.__audioLog.push({ t: Date.now(), mp3: btoa(bin) });
    };
    audio.play().catch(resolve);
  });
}

/* ----------------------------------------------------------------- cards */
const LABEL = {
  convert: 'Conversion', get_rate: 'Latest rates', compare_corridor: 'Across sources',
  watch_rate: 'Watch saved', check_watches: 'Your watchlist', remove_watch: 'Watch removed',
  get_inflation: 'Inflation', get_gold: 'Gold coin prices', list_countries: 'Countries', list_currencies: 'Currencies',
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function badges(line) {
  let out = '';
  const age = /⏳ (\d+) days old/.exec(line);
  if (age) out += ` <span class="badge age">${age[1]} days old</span>`;
  if (/STALE|⚠ stale/.test(line)) out += ' <span class="badge stale">source failing</span>';
  return out;
}
function clean(line) {
  return line.replace(/⏳ \d+ days old/, '').replace(/\s*⚠ STALE.*$/, '').replace(/^\s*[•↳]\s*/, '').trim();
}

function cardFor(call) {
  const out = call.output || call.error || '';
  const lines = out.split('\n').filter((l) => l.trim());
  const head = `<div class="tool"><span>${esc(call.error ? 'Tool error' : (LABEL[call.name] || call.name))}</span><code>${esc(call.name)}</code></div>`;
  let body = '';

  if (call.error) {
    return `<div class="card err">${head}<div class="sub">${esc(call.error.slice(0, 300))}</div></div>`;
  } else if (call.name === 'convert' && / = /.test(lines[0] || '')) {
    const [from, to] = lines[0].split(' = ');
    const rate = /Rate used: (.*?) \((.*?), as of (.*?)\)/.exec(out);
    const legs = lines.filter((l) => l.trim().startsWith('↳'));
    body = `<div class="sub">${esc(from)} =</div><div class="hero">${esc(to)}</div>` +
      (rate ? `<div class="sub">${esc(rate[1])} · ${esc(rate[2])} · as of ${esc(rate[3])}</div>` : '') +
      legs.map((l) => `<div class="sub">${esc(clean(l).split(' — ')[0])}${badges(l)}</div>`).join('') +
      lines.filter((l) => l.startsWith('⚠')).map((l) => `<div class="note">${esc(l)}</div>`).join('');
  } else if (call.name === 'compare_corridor') {
    const quotes = lines.filter((l) => l.startsWith('•')).map((l) => {
      const m = /^•\s*(.*?):\s*([\d.]+)\s*—\s*(\S+)/.exec(l);
      return m ? { who: m[1], rate: Number(m[2]), date: m[3], line: l } : null;
    }).filter(Boolean);
    const max = Math.max(...quotes.map((q) => q.rate));
    const min = Math.min(...quotes.map((q) => q.rate));
    const spread = /Spread across sources: ([\d.]+%)/.exec(out);
    const single = /Only (.*?) publishes/.exec(out);
    body = `<div class="hero">${esc(lines[0].replace(/ across.*/, ''))}</div>` +
      `<div class="bars">${quotes.map((q) => {
        const w = max === min ? 100 : 35 + 65 * (q.rate - min) / (max - min);
        return `<div class="bar"><span>${esc(q.who)}</span><i style="width:${w}%"></i><span>${q.rate.toPrecision(6)}</span></div>`;
      }).join('')}</div>` +
      (spread ? `<div class="sub">Spread between sources: <b>${esc(spread[1])}</b></div>` : '') +
      (single ? `<div class="sub">Only ${esc(single[1])} publishes this pair — one quote, not a zero spread.</div>` : '');
  } else if (call.name === 'watch_rate') {
    const what = /Watching: tell you when (.*)\./.exec(out);
    const now = /Now: (.*?) \(/.exec(out);
    const id = /\b(wl_[a-z2-9]{10})\b/.exec(out);
    body = `<div class="bell">🔔</div><div class="hero" style="font-size:28px">${esc(what ? what[1] : 'Watch set')}</div>` +
      (now ? `<div class="sub">Now ${esc(now[1])}</div>` : '') +
      (/already holds/.test(out) ? '<div class="note">That already holds today — it will fire on the next check.</div>' : '') +
      (/last published (\d+) days ago/.test(out) ? `<div class="note">Source last published ${/last published (\d+) days ago/.exec(out)[1]} days ago.</div>` : '') +
      (id ? `<div class="sub">Saved to watchlist <code>${esc(id[1])}</code></div>` : '');
  } else if (call.name === 'check_watches') {
    const items = [];
    for (let i = 1; i < lines.length; i++) {
      const l = lines[i];
      if (l.startsWith('🔔') || l.startsWith('•')) items.push({ head: l, detail: lines[i + 1] && lines[i + 1].startsWith('  ') ? lines[i + 1] : '' });
    }
    body = `<div class="sub">${esc(lines[0] || '')}</div>` + items.map((it) =>
      `<div class="alert ${it.head.startsWith('🔔') ? 'fired' : ''}"><b>${esc(it.head)}</b><small>${esc(it.detail.trim())}</small></div>`).join('') +
      lines.filter((l) => l.startsWith('⚠')).map((l) => `<div class="note">${esc(l)}</div>`).join('');
  } else if (lines.some((l) => l.trim().startsWith('•'))) {
    body = `<div class="sub">${esc(lines[0])}</div><ul>${lines.filter((l) => l.trim().startsWith('•')).slice(0, 6).map((l) => {
      const c = clean(l); const [what, when] = c.split(' — ');
      return `<li><span>${esc(what)}${badges(l)}</span><span>${esc(when || '')}</span></li>`;
    }).join('')}</ul>`;
  } else {
    body = `<div class="raw">${esc(out.slice(0, 600))}</div>`;
  }
  return `<div class="card">${head}${body}</div>`;
}

function render(heard, calls, reply) {
  const useful = calls.filter((c) => !['list_countries', 'list_currencies'].includes(c.name));
  const ok = useful.filter((c) => !c.error);
  const shown = (ok.length ? ok : useful).slice(-2);
  $('stage').innerHTML =
    `<div class="heard">${heard ? `“${esc(heard)}”` : ''}</div>` +
    `<div class="cards">${shown.map(cardFor).join('')}</div>`;
  $('reply').textContent = reply || '';
  $('log').textContent = calls.length
    ? calls.map((c) => `→ ${c.name}(${JSON.stringify(c.arguments)})\n${c.output || c.error}`).join('\n\n')
    : 'No MCP calls in this answer.';
}

/* ----------------------------------------------------------------- turns */
async function ask(text) {
  setMode('thinking');
  $('stage').innerHTML = `<div class="heard">“${esc(text)}”</div><div class="cards"></div>`;
  $('reply').textContent = '';
  const res = await fetch('/api/ask', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text, previous_response_id: state.previous, watchlist: state.watchlist }),
  });
  const body = await res.json();
  if (!res.ok) { setMode(null); $('reply').textContent = `Sorry — ${body.error}`; return; }
  state.previous = body.response_id;
  if (body.watchlist && body.watchlist !== state.watchlist) {
    state.watchlist = body.watchlist;
    try { localStorage.setItem('afrirate.watchlist', body.watchlist); } catch {}
    showChip();
  }
  render(text, body.calls, body.reply);
  setMode('speaking');
  await play(body.reply).catch(() => {});
  setMode(null);
  return body;
}

function newDay() {
  state.previous = null;
  $('stage').innerHTML = '<div class="idle"><div class="clock" id="bigclock"></div><div class="hint">A new conversation. Your watchlist is still on this device.</div></div>';
  $('reply').textContent = '';
  tick();
}

$('text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.value.trim()) { const t = e.target.value.trim(); e.target.value = ''; ask(t); }
});
$('newday').addEventListener('click', newDay);

/* ------------------------------------------------------------ microphone */
let recorder = null;
$('mic').addEventListener('click', async () => {
  if (recorder) { recorder.stop(); return; }
  if (currentAudio) currentAudio.pause();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { $('reply').textContent = 'The microphone is blocked — type instead.'; return; }
  const chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    $('mic').classList.remove('rec'); $('mic').textContent = '🎙 Talk';
    const blob = new Blob(chunks, { type: recorder.mimeType });
    recorder = null;
    setMode('thinking');
    const res = await fetch('/api/transcribe', { method: 'POST', headers: { 'content-type': blob.type }, body: blob });
    const { text, error } = await res.json();
    if (!res.ok || !text) { setMode(null); $('reply').textContent = error || "I didn't catch that."; return; }
    ask(text);
  };
  recorder.start();
  setMode('listening');
  $('mic').classList.add('rec'); $('mic').textContent = '■ Stop';
});

/* -------------------------------------------- hooks for the video recorder */
window.demo = {
  // Speak a line as the user, in a different voice, then ask it.
  async say(text, voice = 'echo') {
    newCaption(null);
    setMode('listening');
    $('stage').innerHTML = `<div class="heard">“${esc(text)}”</div><div class="cards"></div>`;
    $('reply').textContent = '';
    await play(text, voice);
    return ask(text.replace(/^Alexa,?\s*/i, ''));
  },
  // A full-screen narrator card.
  async title(html, narration, voice = 'ash') {
    $('overlay').innerHTML = html; $('overlay').classList.add('on');
    if (narration) await play(narration, voice);
  },
  hideTitle() { $('overlay').classList.remove('on'); },
  async caption(text, narration, voice = 'ash') {
    newCaption(text);
    if (narration) await play(narration, voice);
  },
  newDay,
  forget() { state.watchlist = null; try { localStorage.removeItem('afrirate.watchlist'); } catch {} showChip(); },
  recording(on) { document.body.classList.toggle('recording', on); },
};
function newCaption(text) {
  $('caption').textContent = text || '';
  $('caption').classList.toggle('on', !!text);
}
</script>
</body>
</html>
